name: CI

on:
  push:
    branches: [main, 'experiment/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Unit tests mock external calls, but LangChain validates these values
    # while importing the application configuration.
    env:
      OPENAI_API_KEY: ci-test-key
      OPENAI_BASE_URL: https://example.invalid/v1
      MODEL_NAME: ci-test-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q . -x "(resources|private|\.venv|\.git)"
      - run: python -B benchmark/experiments/run_offline_tests.py
