name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Unit tests mock external calls, but LangChain validates these values
    # while importing the application configuration.
    env:
      DASHSCOPE_API_KEY: ci-test-key
      DASHSCOPE_BASE_URL: https://example.invalid/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile *.py benchmark/*.py
      - run: python -m unittest discover -s tests -v
